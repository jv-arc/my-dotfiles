$mainMod = SUPER
$terminal = kitty 

bind = Ctrl+Super, T, exec, ~/.config/ags/scripts/color_generation/switchwall.sh # Change wallpaper

bind = $mainMod, L, exec, hyprctl dispatch overview:toggle
bind = $mainMod, Slash, exec, pkill fuzzel || fuzzel # Toggle fallback launcher: fuzzel
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,

bind = $mainMod, V, exec, pkill fuzzel || cliphist list | fuzzel  --match-mode fzf --dmenu | cliphist decode | wl-copy # Clipboard history >> clipboard
bind = $mainMod, Period, exec, pkill fuzzel || ~/.local/bin/fuzzel-emoji # Pick emoji >> clipboardsss
bind = $mainMod, P, exec, ps aux | awk '{print $2 " " $11}' | fuzzel --dmenu | awk '{print $1}' | xargs kill

bind = $mainMod, K, exec, echo "" | fuzzel --dmenu --prompt="calc: " | bc | wl-copys

bind = , PRINT, exec, hyprshot -z -m output
bind = $mainMod, PRINT, exec, hyprshot -z -m window
bind = $mainMod+Shift, PRINT, exec, hyprshot -z -m region





# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow      # Super + Left Click to move
bindm = $mainMod, mouse:273, resizewindow    # Super + Right Click to resize


#===================================================
#---------------Fn Base Keybindings-----------------
#===================================================

bindl = Alt ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindl = Super ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # [hidden]
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # [hidden]
bindl = Super+Shift,M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # [hidden]

# Brightness
bindle = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-


# Volume
bindle=, XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # [hidden]
bindle=, XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # [hidden]


#===================================================
#------------Base Window Keybindings----------------
#===================================================

# Main keybindings 
bind = $mainMod, G, togglefloating,
bind = $mainMod, O, layoutmsg, togglesplit
bind = $mainMod, C, exec, hyprctl --batch "dispatch togglefloating ; dispatch centerwindow 1"
bind = $mainMod, S, togglegroup

bind = $mainMod, bracketleft, changegroupactive, f
bind = $mainMod, bracketright, changegroupactive, b
bind = $mainMod SHIFT, bracketleft, movegroupwindow, f
bind = $mainMod SHIFT, bracketright, movegroupwindow, b



# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows (arrow keys only)
bind = $mainMod SHIFT, left, movewindoworgroup, l
bind = $mainMod SHIFT, right, movewindoworgroup, r
bind = $mainMod SHIFT, up, movewindoworgroup, u
bind = $mainMod SHIFT, down, movewindoworgroup, d

# Change wokspaces (relative)
bind = $mainMod CTRL, left, workspace, r-1
bind = $mainMod CTRL, right, workspace, r+1
bind = $mainMod CTRL, up, workspace, -1
bind = $mainMod CTRL, down, workspace, +1

# Change workspaces (direct)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace (follow, relative)
bind = $mainMod CTRL SHIFT, left, movetoworkspace, r-1
bind = $mainMod CTRL SHIFT, right, movetoworkspace, r+1
bind = $mainMod CTRL SHIFT, up, movetoworkspace, r-1
bind = $mainMod CTRL SHIFT, down, movetoworkspace, r+1

# Move window to workspace (follow, direct)
bind = $mainMod CTRL SHIFT, 1, movetoworkspace, 1
bind = $mainMod CTRL SHIFT, 2, movetoworkspace, 2
bind = $mainMod CTRL SHIFT, 3, movetoworkspace, 3
bind = $mainMod CTRL SHIFT, 4, movetoworkspace, 4
bind = $mainMod CTRL SHIFT, 5, movetoworkspace, 5
bind = $mainMod CTRL SHIFT, 6, movetoworkspace, 6
bind = $mainMod CTRL SHIFT, 7, movetoworkspace, 7
bind = $mainMod CTRL SHIFT, 8, movetoworkspace, 8
bind = $mainMod CTRL SHIFT, 9, movetoworkspace, 9
bind = $mainMod CTRL SHIFT, 0, movetoworkspace, 10

# Move window to workspace (silent, relative)
bind = $mainMod ALT, left, movetoworkspacesilent, r-1
bind = $mainMod ALT, right, movetoworkspacesilent, r+1
bind = $mainMod ALT, up, movetoworkspacesilent, r-1
bind = $mainMod ALT, down, movetoworkspacesilent, r+1

# Move window to workspace (silent, direct)
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10


#===================================================
#------------Adjustment  Keybindings----------------
#===================================================

bind = $mainMod, RETURN, submap, adjustment

submap = adjustment

# Commands
bind = , O, layoutmsg, togglesplit
bind = , C, exec, hyprctl --batch "dispatch togglefloating ; dispatch centerwindow 1"


# Move windows (arrow keys only - no modifiers needed)
bind = , left, movewindoworgroup, l
bind = , right, movewindoworgroup, r
bind = , up, movewindoworgroup, u
bind = , down, movewindoworgroup, d

# Resize windows (Shift + arrows)
binde = SHIFT, left, resizeactive, -30 0
binde = SHIFT, right, resizeactive, 30 0
binde = SHIFT, up, resizeactive, 0 -30
binde = SHIFT, down, resizeactive, 0 30

# Swap windows (Ctrl + arrows) 
bind = CTRL, left, swapwindow, l
bind = CTRL, right, swapwindow, r
bind = CTRL, up, swapwindow, u
bind = CTRL, down, swapwindow, d

# Pop!_OS style: workspace movement within adjustment mode
bind = CTRL SHIFT, left, movetoworkspace, -1
bind = CTRL SHIFT, right, movetoworkspace, +1

# Cycle layout orientation while in adjustment mode
bind = , O, layoutmsg, orientationnext

# Toggle floating while in adjustment mode
bind = , G, togglefloating,

# Exit adjustment mode (Enter applies, Esc cancels)
bind = , RETURN, submap, reset
bind = , escape, submap, reset

submap = reset


#===================================================
#----------------Stack Keybindings------------------
#===================================================
bind = $mainMod, SPACE, submap, stack

submap = stack

bind = , S, togglegroup
bind = , T, lockactivegroup, toggle


bind = $mainMod, SPACE, submap, reset
bind = , escape, submap, reset
submap = reset


