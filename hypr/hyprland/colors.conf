group {
	col.border_active = rgba(85d2e7FF) rgba(85d2e7FF) rgba(85d2e7FF) rgba(091518FF) rgba(85d2e7FF) 

  col.border_inactive = rgba(85d2e766) rgba(091518FF) rgba(85d2e766) rgba(091518FF)

	col.border_locked_active = rgba(85d2e788) rgba(85d2e7FF) rgba(efb0ffFF) rgba(85d2e7FF)

  col.border_locked_inactive = rgba(efb0ff66) rgba(091518FF) rgba(efb0ff66) rgba(091518FF)


	groupbar {
		gradients = true
		gradient_rounding = 4
		stacked = false
		height = 8
		indicator_height = 0
		render_titles = false
