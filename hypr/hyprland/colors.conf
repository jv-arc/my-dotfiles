general {
	col.active_border = rgba(9fcaff00) rgba(9fcaff00) rgba(9fcaffFF) rgba(9fcaff00) rgba(9fcaff00) rgba(d5bbfcFF)
  col.inactive_border = rgba(4b435788)
}

group {
	col.border_active = rgba(d5bbfcFF) rgba(d5bbfcFF) rgba(d5bbfcFF) rgba(15121bFF) rgba(d5bbfcFF) 

  col.border_inactive = rgba(d5bbfc66) rgba(15121bFF) rgba(d5bbfc66) rgba(15121bFF)

	col.border_locked_active = rgba(d5bbfc88) rgba(d5bbfcFF) rgba(efb0ffFF) rgba(d5bbfcFF)

  col.border_locked_inactive = rgba(efb0ff66) rgba(15121bFF) rgba(efb0ff66) rgba(15121bFF)


	groupbar {
		gradients = true
		gradient_rounding = 4
		stacked = false
		height = 8
		indicator_height = 0
		render_titles = false
		col.active = rgba(d5bbfcFF) 
  	col.inactive = rgba(d5bbfc88)
		col.locked_active = rgba(d5bbfcFF) 
  	col.locked_inactive = rgba(d5bbfc88)
		text_color = rgba(003259FF)
	}
}



misc {
    background_color = rgba(15121bFF)
}

decoration {
	shadow {
			color = rgba(a1cafdCC)
			color_inactive = rgba(15121b00)
	}
}

plugin {
	hyprbars {
		# Honestly idk if it works like css, but well, why not
		bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
		bar_height = 30
		bar_padding = 10
		bar_button_padding = 5
		bar_precedence_over_border = true
		bar_part_of_window = true

		bar_color = rgba(15121bFF)
		col.text = rgba(e8dfeeFF)


		# example buttons (R -> L)
		# hyprbars-button = color, size, on-click
		hyprbars-button = rgb(e8dfee), 13, 󰖭, hyprctl dispatch killactive
		hyprbars-button = rgb(e8dfee), 13, 󰖯, hyprctl dispatch fullscreen 1
		hyprbars-button = rgb(e8dfee), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
	}
}

windowrulev2 = bordercolor rgba(9fcaffAA) rgba(9fcaff77),pinned:1
