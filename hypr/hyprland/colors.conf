general {
	col.active_border = rgba(ffffff00) rgba(ffffff00) rgba(ffffffFF) rgba(ffffff00) rgba(ffffff00) rgba(e2e2e2FF)
  col.inactive_border = rgba(47474788)
}

group {
	col.border_active = rgba(e2e2e2FF) rgba(e2e2e2FF) rgba(e2e2e2FF) rgba(131313FF) rgba(e2e2e2FF) 

  col.border_inactive = rgba(e2e2e266) rgba(131313FF) rgba(e2e2e266) rgba(131313FF)

	col.border_locked_active = rgba(e2e2e288) rgba(e2e2e2FF) rgba(ffffffFF) rgba(e2e2e2FF)

  col.border_locked_inactive = rgba(ffffff66) rgba(131313FF) rgba(ffffff66) rgba(131313FF)


	groupbar {
		gradients = true
		gradient_rounding = 4
		text_color = rgba(1b1b1bFF)
		stacked = false
		
		col.active = rgba(e2e2e2FF) 
   	col.inactive = rgba(e2e2e288)
		col.locked_active = rgba(e2e2e2FF) 
   	col.locked_inactive = rgba(e2e2e288)

	}
}



misc {
    background_color = rgba(131313FF)
}

decoration {
    shadow {
        color = rgba(c6c6c6CC)
        color_inactive = rgba(13131300)
    }
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(131313FF)
        col.text = rgba(e2e2e2FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(e2e2e2), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(e2e2e2), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(e2e2e2), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(ffffffAA) rgba(ffffff77),pinned:1
