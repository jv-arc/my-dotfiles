general {
    col.active_border = rgba(74d1ffFF) rgba(bec2ff55) rgba(8ecff2FF) rgba(74d1ff55) rgba(bec2ffFF) rgba(8ecff255) 270deg
    col.inactive_border = rgba(44455999)
}

misc {
    background_color = rgba(12131cFF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(12131cFF)
        col.text = rgba(e3e1efFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(e3e1ef), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(e3e1ef), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(e3e1ef), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(74d1ffAA) rgba(74d1ff77),pinned:1
