general {
	col.active_border = rgba(ffb3ad00) rgba(ffb3ad00) rgba(ffb3adFF) rgba(ffb3ad00) rgba(ffb3ad00) rgba(e1c28cFF)
  col.inactive_border = rgba(47474788)
}

group {
	col.border_active = rgba(e1c28cFF) rgba(e1c28cFF) rgba(e1c28cFF) rgba(131313FF) rgba(e1c28cFF) 

  col.border_inactive = rgba(e1c28c66) rgba(131313FF) rgba(e1c28c66) rgba(131313FF)

	col.border_locked_active = rgba(e1c28c88) rgba(e1c28cFF) rgba(ffb4abFF) rgba(e1c28cFF)

  col.border_locked_inactive = rgba(ffb4ab66) rgba(131313FF) rgba(ffb4ab66) rgba(131313FF)


	groupbar {
		gradients = true
		gradient_rounding = 4
		text_color = rgba(5f1414FF)
		stacked = false
		
		col.active = rgba(e1c28cFF) 
   	col.inactive = rgba(e1c28c88)
		col.locked_active = rgba(e1c28cFF) 
   	col.locked_inactive = rgba(e1c28c88)

	}
}



misc {
    background_color = rgba(131313FF)
}

decoration {
    shadow {
        color = rgba(e7bdb9CC)
        color_inactive = rgba(13131300)
    }
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(131313FF)
        col.text = rgba(e2e2e2FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(e2e2e2), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(e2e2e2), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(e2e2e2), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(ffb3adAA) rgba(ffb3ad77),pinned:1
