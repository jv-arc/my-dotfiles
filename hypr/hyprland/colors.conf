general {
    col.active_border = rgba(87cffbF0) rgba(c5cc84F0) rgba(87cffbF0) rgba(c5cc84F0) rgba(87cffbF0) rgba(c5cc84F0) 
    col.inactive_border = rgba(57414388)
}

misc {
    background_color = rgba(1b1011FF)
}

decoration {
    shadow {
        color = rgba(87cffbFF)
        color_inactive = rgba(1b101100)
    }
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(1b1011FF)
        col.text = rgba(f4dddeFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(f4ddde), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(f4ddde), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(f4ddde), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(87cffbAA) rgba(87cffb77),pinned:1
