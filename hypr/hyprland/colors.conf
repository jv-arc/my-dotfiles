general {
    col.active_border = rgba(84d0f900) rgba(84d0f900) rgba(84d0f9FF) rgba(84d0f900) rgba(84d0f900) rgba(c8cb82FF)
    col.inactive_border = rgba(57414488)
}

misc {
    background_color = rgba(1b1012FF)
}

decoration {
    shadow {
        color = rgba(f5b9a3CC)
        color_inactive = rgba(1b101200)
    }
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(1b1012FF)
        col.text = rgba(f3dddfFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(f3dddf), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(f3dddf), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(f3dddf), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(84d0f9AA) rgba(84d0f977),pinned:1
