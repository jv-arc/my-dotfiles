general {
	col.active_border = rgba(ffb1c600) rgba(ffb1c600) rgba(ffb1c6FF) rgba(ffb1c600) rgba(ffb1c600) rgba(6bde6eFF)
  col.inactive_border = rgba(59404688)
}

group {
	col.border_active = rgba(6bde6eFF) rgba(6bde6eFF) rgba(6bde6eFF) rgba(1d0f13FF) rgba(6bde6eFF) 

  col.border_inactive = rgba(6bde6e66) rgba(1d0f13FF) rgba(6bde6e66) rgba(1d0f13FF)

	col.border_locked_active = rgba(6bde6e88) rgba(6bde6eFF) rgba(ffb2b6FF) rgba(6bde6eFF)

  col.border_locked_inactive = rgba(ffb2b666) rgba(1d0f13FF) rgba(ffb2b666) rgba(1d0f13FF)


	groupbar {
		gradients = true
		gradient_rounding = 4
		stacked = false
		height = 8
		indicator_height = 0
		render_titles = false
		col.active = rgba(6bde6eFF) 
  	col.inactive = rgba(6bde6e88)
		col.locked_active = rgba(6bde6eFF) 
  	col.locked_inactive = rgba(6bde6e88)
		text_color = rgba(650030FF)
	}
}



misc {
    background_color = rgba(1d0f13FF)
}

decoration {
	shadow {
			color = rgba(ffb1c6CC)
			color_inactive = rgba(1d0f1300)
	}
}

plugin {
	hyprbars {
		# Honestly idk if it works like css, but well, why not
		bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
		bar_height = 30
		bar_padding = 10
		bar_button_padding = 5
		bar_precedence_over_border = true
		bar_part_of_window = true

		bar_color = rgba(1d0f13FF)
		col.text = rgba(f7dce1FF)


		# example buttons (R -> L)
		# hyprbars-button = color, size, on-click
		hyprbars-button = rgb(f7dce1), 13, 󰖭, hyprctl dispatch killactive
		hyprbars-button = rgb(f7dce1), 13, 󰖯, hyprctl dispatch fullscreen 1
		hyprbars-button = rgb(f7dce1), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
	}
}

windowrulev2 = bordercolor rgba(ffb1c6AA) rgba(ffb1c677),pinned:1
