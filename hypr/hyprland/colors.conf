  col.inactive_border = rgba(41484d88)
}

group {
	col.border_active = rgba(ccc1e9FF) rgba(ccc1e9FF) rgba(ccc1e9FF) rgba(0f1417FF) rgba(ccc1e9FF) 

  col.border_inactive = rgba(ccc1e966) rgba(0f1417FF) rgba(ccc1e966) rgba(0f1417FF)

	col.border_locked_active = rgba(ccc1e988) rgba(ccc1e9FF) rgba(ffb2b9FF) rgba(ccc1e9FF)

