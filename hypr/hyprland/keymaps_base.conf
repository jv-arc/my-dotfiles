$zoomScript = ~/.config/hypr/hyprland/scripts/zoom.sh
$recordScript = ~/.config/hypr/hyprland/scripts/record.sh
$aiQuery = ~/.config/hypr/hyprland/scripts/ai/primary-buffer-query.sh


bindld = Ctrl,Print, Screenshot >> clipboard & save, exec, mkdir -p $(xdg-user-dir PICTURES)/Screenshots && grim $(xdg-user-dir PICTURES)/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Screenshot >> clipboard & file
bindld = ,Print, Screenshot >> clipboard ,exec,grim - | wl-copy

bind = Super, Q, killactive, # Close
bind = Super+Shift+Alt, Q, exec, hyprctl kill # Forcefully zap a window

bindm = Super, mouse:272, movewindow # Move
bindm = Super, mouse:274, movewindow # [hidden]
bindm = Super, mouse:273, resizewindow # Resize

bindld = Super, M, Toggle mute, exec, wpctl set-mute @DEFAULT_SINK@ toggle

bind = Super, S, submap, special
bind = Super, Space, submap, leader_submap
bind = Super+Shift, escape, submap, block_submap


bind = Super, 1, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 1 # [hidden]
bind = Super, 2, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 2 # [hidden]
bind = Super, 3, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 3 # [hidden]
bind = Super, 4, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 4 # [hidden]
bind = Super, 5, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 5 # [hidden]
bind = Super, 6, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 6 # [hidden]
bind = Super, 7, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 7 
bind = Super, 8, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 8 
bind = Super, 9, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 9 
bind = Super, 0, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 10 

# Blocks any keybinds until
# "e-x-i-t" is typed
submap=block_submap
bind = Super,e, submap, block_e_submap
submap=reset
submap=block_e_submap
bind = , catchall , submap, block_submap
bind = Super,x, submap, block_x_submap
submap=reset
submap=block_x_submap
bind = , catchall , submap, block_submap
bind = Super,i, submap, block_i_submap
submap=reset
submap=block_i_submap
bind = , catchall , submap, block_submap
bind = Super,t, submap, reset
submap=reset


submap=special
bind = , catchall, submap, reset
bind = ,T,togglespecialworkspace, ticktick
bind = ,N,togglespecialworkspace, notes
submap=reset

submap=leader_submap
bind = , catchall, submap, reset

bind = , F, submap, float_submap
bind = , G, submap, group_submap

bind = , W, submap, window_submap
bind = Shift, W, submap, workspace_submap
bind = Alt, W, submap, resize_submap

bind = , C, submap, config_submap
bind = Shift, C, submap, cosmetic_submap

bind = , U, submap, utility_submap
bind = Shift, U, submap, session_submap

bind = , Return, submap, launch_submap
bind = , M, submap, media_submap
bind = , S, submap, special_submap
submap=reset




submap=launch_submap
bind = , catchall, submap, reset

bind = , T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh  "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm" # [hidden] (terminal) (alt)
bind = , E, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "dolphin" "nautilus" "nemo" "thunar" "${TERMINAL}" "kitty -1 fish -c yazi" # File manager
bind = , W, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium" "microsoft-edge-stable" "opera" "librewolf" # Browser
bind = , C, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "kitty -T nvim ~/0/my-dotfiles/scripts/nvim_start.sh" "code" "codium" "cursor" "zed" "zedit" "zeditor" "kate" "gnome-text-editor" "emacs" "command -v micro && kitty -1 micro" # Code editor
bind = , V, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "pavucontrol-qt" "pavucontrol" # Volume mixer
# bind = , I, exec, XDG_CURRENT_DESKTOP=gnome ~/.config/hypr/hyprland/scripts/launch_first_available.sh "qs -p ~/.config/quickshell/$qsConfig/settings.qml" "systemsettings" "gnome-control-center" "better-control" # Settings app
bind = , Escape, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "gnome-system-monitor" "plasma-systemmonitor --page-name Processes" "command -v btop && kitty -1 fish -c btop" # Task manager
submap=reset


submap=session_submap
bind = , catchall, submap, reset
submap=reset

submap=config_submap
bind = , catchall, submap, reset
submap=reset

submap=media_submap
bind = , catchall, submap, reset
bindl= , N, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # Next track
bind = Super+Shift+Alt, mouse:275, exec, playerctl previous # [hidden]
bind = Super+Shift+Alt, mouse:276, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # [hidden]
bindl= Shift, N, exec, playerctl previous # [hidden]
# bindd = , , Toggle media controls, global, quickshell:mediaControlsToggle # Toggle media controls
submap=reset




submap=cosmetic_submap
bind = , catchall, submap, reset

# bindd = , T, Toggle wallpaper selector, global, quickshell:wallpaperSelectorToggle # Wallpaper selector
# bindd = Shift, T, Select random wallpaper, global, quickshell:wallpaperSelectorRandom # Random wallpaper
# bindd = , K, Generate Random Quote, exec, bash /home/jvctr/0/my-scripts/splash.sh
# bindd = , T, Change wallpaper, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/quickshell/$qsConfig/scripts/colors/switchwall.sh # [hidden] Change wallpaper (fallback)
# bind = , R, exec, killall ags agsv1 gjs ydotool qs quickshell; qs -c $qsConfig & # Restart widgets
submap=reset



submap=float_submap
bind = , catchall, submap, reset

bind = , Space, togglefloating, # Float/Tile
bind = , D, fullscreen, 1 # Maximize
bind = , F, fullscreen, 0 # Fullscreen
bind = Shift, F, fullscreenstate, 0 3 # Fullscreen spoof
submap=reset



submap=group_submap
bind = , catchall, submap, reset

bind = , bracketleft, changegroupactive, b
bind = , bracketright, changegroupactive, f
bind = Shift, bracketleft, movegroupwindow, b
bind = Shift, bracketright, movegroupwindow, f
bind = , L, lockgroups, toggle
submap=reset



submap = utility_submap
bind = , catchall, submap, reset
bind = , R, submap, record_submap
bind = , Z, submap, zoom_submap

bindd = , Period, Copy an emoji, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || ~/.config/hypr/hyprland/scripts/fuzzel-emoji.sh copy # [hidden] Emoji >> clipboard (fallback)
bindd = , V, Copy clipboard history entry, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || cliphist list | fuzzel --match-mode fzf --dmenu | cliphist decode | wl-copy # [hidden] Clipboard history >> clipboard (fallback)
bindd = , S, Screen snip, exec, qs -p ~/.config/quickshell/$qsConfig/screenshot.qml || pidof slurp || hyprshot --freeze --clipboard-only --mode region --silent
bindd = , T, Character recognition,exec,grim -g "$(slurp $SLURP_ARGS)" "tmp.png" && tesseract "tmp.png" - | wl-copy && rm "tmp.png"
bindd = , C, Color picker, exec, hyprpicker -a & $resetSubMap
bindd = , mouse:273, Generate AI summary for selected text, exec, $aiQuery & $resetSubMap
submap=reset


submap=zoom_submap
bind  = , catchall, submap, reset

# binde = , Minus, exec, qs -c $qsConfig ipc call zoom zoomOut # Zoom out
# binde = , Equal, exec, qs -c $qsConfig ipc call zoom zoomIn # Zoom in
# binde = , Minus, exec, qs -c $qsConfig ipc call TEST_ALIVE || $zoomScript decrease 0.1 # [hidden] Zoom out
# binde = , Equal, exec, qs -c $qsConfig ipc call TEST_ALIVE || $zoomScript increase 0.1 # [hidden] Zoom in
submap = reset

submap= record_submap
bind = , catchall, submap, reset

bindd = , R, Record region (no sound), exec, $recordScript # Record region (no sound)
bindd = , S, Record screen (no sound), exec, $recordScript --fullscreen # [hidden] Record screen (no sound)
bindd = Shift, S, Record screen (with sound), exec,  $recordScript --fullscreen-sound # Record screen (with sound)
submap = reset






submap=window_submap
bind = , catchall, submap, reset
bind = , M, submap, move_window_in_workspace_regular_submap
bind = Shift, M, submap, move_window_in_workspace_silent_submap
bind = , Alt, submap, resize_submap

bind = , h, movefocus, l
bind = , l, movefocus, r
bind = , k, movefocus, u
bind = , j, movefocus, d

bind = , BracketLeft, movefocus, l
bind = , BracketRight, movefocus, r

bind = Shift, h, movewindoworgroup, l
bind = Shift, l, movewindoworgroup, r
bind = Shift, k, movewindoworgroup, u
bind = Shift, j, movewindoworgroup, d
submap=reset




submap = resize_submap
bind = , catchall, submap, reset

bind = , Return, resizeactive, exact 640 480 # [hidden]
binde = , BracketRight, splitratio, -0.1 # [hidden]
binde = , BracketLeft, splitratio, +0.1 # [hidden]
submap=reset



submap=move_window_in_workspace_silent_submap
bind = , catchall, submap, reset

bind = , BracketLeft, movetoworkspacesilent, -1 # [hidden]
bind = , BracketRight, movetoworkspacesilent, +1 # [hidden]

bind = Shift, BracketLeft, movetoworkspacesilent, -10 # [hidden]
bind = Shift, BracketRight, movetoworkspacesilent, +10 # [hidden]

bind = , 1, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 1 # [hidden]
bind = , 2, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 2 # [hidden]
bind = , 3, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 3 # [hidden]
bind = , 4, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 4 # [hidden]
bind = , 5, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 5 # [hidden]
bind = , 6, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 6 # [hidden]
bind = , 7, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 7 # [hidden]
bind = , 8, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 8 # [hidden]
bind = , 9, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 9 # [hidden]
bind = , 0, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 10 # [hidden]
submap=reset




submap=move_window_in_workspace_regular_submap
bind = , catchall, submap, reset

#/#bind = [/] # Move windows to previous/next workspace
bind = , BracketLeft, movetoworkspace, -1 # [hidden]
bind = , BracketRight, movetoworkspace, +1 # [hidden]

#/#bind = Super+Ctrl+Shift, ./j/k/., # Move windows to previous/next workspace row
bind = Shift, BracketLeft, movetoworkspace, -10 # [hidden]
bind = Shift, BracketRight, movetoworkspace, +10 # [hidden]

bind = , 1, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 1 # [hidden]
bind = , 2, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 2 # [hidden]
bind = , 3, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 3 # [hidden]
bind = , 4, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 4 # [hidden]
bind = , 5, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 5 # [hidden]
bind = , 6, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 6 # [hidden]
bind = , 7, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 7 # [hidden]
bind = , 8, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 8 # [hidden]
bind = , 9, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 9 # [hidden]
bind = , 0, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh workspace 10 # [hidden]
submap=reset
