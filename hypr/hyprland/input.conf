
input {
	kb_layout = br
	kb_variant = abnt2
	kb_options = ctrl:nocaps
	numlock_by_default = true

	repeat_delay = 250
	repeat_rate = 35

	follow_mouse = 1

	off_window_axis_events = 2

	touchpad {
		natural_scroll = yes

		disable_while_typing = true
		clickfinger_behavior = true

		scroll_factor = 0.7
	}
}
