# MONITOR CONFIG
monitor=,preferred,auto,1
# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`
# monitor=HDMI-A-1,1920x1080@60,1920x0,1,mirror,eDP-1

#gesture = 3, swipe, move,
#gesture = 4, horizontal, workspace
#gesture = 4, pinch, float
#gesture = 4, up, dispatcher, global, quickshell:overviewToggle
#gesture = 4, down, dispatcher, global, quickshell:overviewClose
#gestures {
#    workspace_swipe_distance = 700
#    workspace_swipe_cancel_ratio = 0.2
#    workspace_swipe_min_speed_to_force = 5
#    workspace_swipe_direction_lock = true
#    workspace_swipe_direction_lock_threshold = 10
#    workspace_swipe_create_new = true
#}

general {
    # Gaps and border
    gaps_in = 3
    gaps_out = 5
    gaps_workspaces = 50

    border_size = 3
    #col.active_border = rgba(0DB7D4FF)
    #col.inactive_border = rgba(31313600)
    resize_on_border = true

    no_focus_fallback = true

    allow_tearing = true # This just allows the `immediate` window rule to work

    snap {
    	enabled = true
    	window_gap = 4
    	monitor_gap = 5
    	respect_gaps = true
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = false
    # precise_mouse_move = true
}

decoration {
    rounding = 16

    blur {
        enabled = true
        xray = true
        special = false
        new_optimizations = true
        size = 14
        passes = 3
        brightness = 1
        noise = 0.04
        contrast = 3
        popups = true
        popups_ignorealpha = 0.6
        input_methods = true
        input_methods_ignorealpha = 0.8
    }

    shadow {
        enabled = true
        ignore_window = true
        range = 9
        offset = 0 0
        render_power = 4
        color = rgba(000000FF)
    }

    # Dim
    dim_inactive = true
    dim_strength = 0.1
    dim_special = 0.07
}

animations {
    enabled = true
    
    # Curves
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    
    #===========Configs===============
    
    # windows
    animation = windowsIn, 1, 3, emphasizedDecel, popin 80%
    animation = windowsOut, 1, 2, emphasizedDecel, popin 90%
    animation = windowsMove, 1, 3, emphasizedDecel, slide
    animation = border, 1, 10, emphasizedDecel
    animation = borderangle, 1, 100, linear, loop
    
    # layers
    animation = layersIn, 1, 2.7, emphasizedDecel, popin 93%
    animation = layersOut, 1, 2.4, menu_accel, popin 94%
    
    # fade
    animation = fadeLayersIn, 1, 0.5, menu_decel
    animation = fadeLayersOut, 1, 2.7, menu_accel
    
    # workspaces
    animation = workspaces, 1, 7, menu_decel, slide
    
    ## specialWorkspace
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1.2, emphasizedAccel, slidevert
}

input {
    kb_layout = br
    kb_variant = abnt2
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35

    follow_mouse = 1
    off_window_axis_events = 2

    touchpad {
        natural_scroll = yes
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.7
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = 1
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = true
    swallow_regex = (foot|kitty|allacritty|Alacritty)
    new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
    session_lock_xray = true
    initial_workspace_tracking = false
    focus_on_activate = true
}

binds {
    scroll_event_delay = 0
    hide_special_on_workspace_change = true
}

cursor {
    zoom_factor = 1
    zoom_rigid = false
    hotspot_padding = 1
}

# Overview
plugin {
    #hyprexpo {
        #columns = 3
        #gap_size = 5
        #bg_col = rgb(000000)
        #workspace_method = first 1 # [center/first] [workspace] e.g. first 1 or center m+1

        #enable_gesture = false # laptop touchpad, 4 fingers
        #gesture_distance = 300 # how far is the "max"
        #gesture_positive = false
    #}

  hy3 {
    # disable gaps when only one window is onscreen
    # 0 - always show gaps
    # 1 - hide gaps with a single window onscreen
    # 2 - 1 but also show the window border
    no_gaps_when_only = <int> # default: 0

    # policy controlling what happens when a node is removed from a group,
    # leaving only a group
    # 0 = remove the nested group
    # 1 = keep the nested group
    # 2 = keep the nested group only if its parent is a tab group
    node_collapse_policy = <int> # default: 2

    # offset from group split direction when only one window is in a group
    group_inset = <int> # default: 10

    # if a tab group will automatically be created for the first window spawned in a workspace
    tab_first_window = <bool>

    # tab group settings
    tabs {
      # height of the tab bar
      height = <int> # default: 22

      # padding between the tab bar and its focused node
      padding = <int> # default: 6

      # the tab bar should animate in/out from the top instead of below the window
      from_top = <bool> # default: false

      # radius of tab bar corners
      radius = <int> # default: 6

      # tab bar border width
      border_width = <int> # default: 2

      # render the window title on the bar
      render_text = <bool> # default: true

      # center the window title
      text_center = <bool> # default: true

      # font to render the window title with
      text_font = <string> # default: Sans

      # height of the window title
      text_height = <int> # default: 8

      # left padding of the window title
      text_padding = <int> # default: 3

      # active tab bar segment colors
      col.active = <color> # default: rgba(33ccff40)
      col.active.border = <color> # default: rgba(33ccffee)
      col.active.text = <color> # default: rgba(ffffffff)

      # active tab bar segment colors for bars on an unfocused monitor
      col.active_alt_monitor = <color> # default: rgba(60606040)
      col.active_alt_monitor.border = <color> # default: rgba(808080ee)
      col.active_alt_monitor.text = <color> # default: rgba(ffffffff)

      # focused tab bar segment colors (focused node in unfocused container)
      col.focused = <color> # default: rgba(60606040)
      col.focused.border = <color> # default: rgba(808080ee)
      col.focused.text = <color> # default: rgba(ffffffff)

      # inactive tab bar segment colors
      col.inactive = <color> # default: rgba(30303020)
      col.inactive.border = <color> # default: rgba(606060aa)
      col.inactive.text = <color> # default: rgba(ffffffff)

      # urgent tab bar segment colors
      col.urgent = <color> # default: rgba(ff223340)
      col.urgent.border = <color> # default: rgba(ff2233ee)
      col.urgent.text = <color> # default: rgba(ffffffff)

      # urgent tab bar segment colors
      col.locked = <color> # default: rgba(90903340)
      col.locked.border = <color> # default: rgba(909033ee)
      col.locked.text = <color> # default: rgba(ffffffff)

      # if tab backgrounds should be blurred
      # Blur is only visible when the above colors are not opaque.
      blur = <bool> # default: true

      # opacity multiplier for tabs
      # Applies to blur as well as the given colors.
      opacity = <float> # default: 1.0
    }

    # autotiling settings
    autotile {
      # enable autotile
      enable = <bool> # default: false

      # make autotile-created groups ephemeral
      ephemeral_groups = <bool> # default: true

      # if a window would be squished smaller than this width, a vertical split will be created
      # -1 = never automatically split vertically
      # 0 = always automatically split vertically
      # <number> = pixel width to split at
      trigger_width = <int> # default: 0

      # if a window would be squished smaller than this height, a horizontal split will be created
      # -1 = never automatically split horizontally
      # 0 = always automatically split horizontally
      # <number> = pixel height to split at
      trigger_height = <int> # default: 0

      # a space or comma separated list of workspace ids where autotile should be enabled
      # it's possible to create an exception rule by prefixing the definition with "not:"
      # workspaces = 1,2 # autotiling will only be enabled on workspaces 1 and 2
      # workspaces = not:1,2 # autotiling will be enabled on all workspaces except 1 and 2
      workspaces = <string> # default: all
    }
  }
}
