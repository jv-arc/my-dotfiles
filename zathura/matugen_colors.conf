" -----------------------------------------------------------------------------
" Zathura Colors
" -----------------------------------------------------------------------------

" Colors
set default-bg              "rgba(12, 21, 23, 0.8)"
set default-fg              "#dbe4e7"

set statusbar-bg            "#432c00"
set statusbar-fg            "#f5bd62"

set inputbar-bg             "#432c00"
set inputbar-fg             "#f5bd62"

set notification-error-bg   "#690005"
set notification-error-fg   "#ffb4ab"

set notification-warning-bg "#ffdeae"
set notification-warning-fg "#93000a"

set highlight-color         "#ffdeae"
set highlight-active-color  "#f5bd62"

set completion-highlight-fg "#432c00"
set completion-highlight-bg "#f5bd62"

set completion-bg           "#432c00"
set completion-fg           "#f5bd62"

set notification-bg         "#432c00"
set notification-fg         "#f5bd62"

set recolor                 "true"
set recolor-lightcolor      "rgba(12, 21, 23, 0.8)"
set recolor-darkcolor       "#c6c2ea"
set recolor-reverse-video   "true"
set recolor-keephue         "true"

