" -----------------------------------------------------------------------------
" Zathura Colors
" -----------------------------------------------------------------------------

" Colors
set default-bg              "rgba(24, 17, 25, 1)"
set default-fg              "#ecdeea"

set statusbar-bg            "#54006c"
set statusbar-fg            "#f1afff"

set inputbar-bg             "#54006c"
set inputbar-fg             "#f1afff"

set notification-error-bg   "#690005"
set notification-error-fg   "#ffb4ab"

set notification-warning-bg "#fbd7ff"
set notification-warning-fg "#93000a"

set highlight-color         "#fbd7ff"
set highlight-active-color  "#f1afff"

set completion-highlight-fg "#54006c"
set completion-highlight-bg "#f1afff"

set completion-bg           "#54006c"
set completion-fg           "#f1afff"

set notification-bg         "#54006c"
set notification-fg         "#f1afff"

set recolor                 "true"
set recolor-lightcolor      "rgba(24, 17, 25, 1)"
set recolor-darkcolor       "#ebb3f6"
set recolor-reverse-video   "true"
set recolor-keephue         "true"

